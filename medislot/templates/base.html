<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MediSlot{% endblock %} - MediSlot Clinic</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f7fb; color: #1b2a41; }
    header { background: #0b6e4f; color: #fff; padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    header .brand { font-size: 1.25rem; }
    header nav { margin-left: auto; display: flex; gap: 1rem; }
    main { max-width: 820px; margin: 2rem auto; background: #fff; padding: 1.5rem 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .flash { background: #fff4e5; border-left: 4px solid #f0a202; padding: .6rem 1rem; margin-bottom: 1rem; }
    label { display: block; margin-top: .8rem; font-weight: 600; }
    input, select { width: 100%; padding: .5rem; margin-top: .3rem; border: 1px solid #c9d3df; border-radius: 6px; box-sizing: border-box; }
    button, .btn { margin-top: 1rem; background: #0b6e4f; color: #fff; border: 0; padding: .6rem 1.2rem; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #e3e9f0; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">MediSlot Clinic</a>
    <nav>
      <a href="{{ url_for('doctors.index') }}">Doctors</a>
      <a href="{{ url_for('doctors.search') }}">Find a doctor</a>
      {% if g.user %}
        <span>Hi, {{ g.user['full_name'] }}</span>
        <a href="{{ url_for('auth.logout') }}">Log out</a>
      {% else %}
        <a href="{{ url_for('auth.register') }}">Register</a>
        <a href="{{ url_for('auth.login') }}">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
