{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <h1>Welcome to MediSlot</h1>
  <p>Book clinic appointments online, receive a token number and skip the queue.</p>
  <a class="btn" href="{{ url_for('doctors.search') }}">Find a doctor</a>
  {% if not g.user %}
    <a class="btn" href="{{ url_for('auth.register') }}">Create a patient account</a>
  {% endif %}
{% endblock %}
